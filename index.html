<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>肌力循環訓練</title>
<style>
  :root{
    --bg:#FBFAF7; --surface:#FFFFFF; --surface-2:#F3F1EC;
    --ink:#1B1D22; --ink-2:#5B5E66; --ink-3:#9A9CA3;
    --line:#E7E4DC; --line-2:#DAD6CC;
    --done:#1F9D57; --done-soft:#E7F5EC; --warn:#C9762F; --err:#C4463C;
    --accent:#1B1D22; --accent-ink:#FBFAF7;
    --lower:#3B6FD8; --upper:#0E9AA7; --cardio:#E0791B; --core:#7C4DD1; --aerobic:#C94F6D;
    --shadow:0 1px 2px rgba(20,20,25,.05), 0 8px 24px rgba(20,20,25,.06);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#131417; --surface:#1C1E23; --surface-2:#24262C;
      --ink:#ECEBE7; --ink-2:#A7A9B0; --ink-3:#6E7178;
      --line:#2C2F35; --line-2:#3A3D44;
      --done:#3FBE76; --done-soft:#17301F; --warn:#E0975A; --err:#E0645A;
      --accent:#ECEBE7; --accent-ink:#131417;
      --lower:#6C97E8; --upper:#3ABECB; --cardio:#F0983F; --core:#A07EE0; --aerobic:#E27B95;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"]{
    --bg:#131417; --surface:#1C1E23; --surface-2:#24262C;
    --ink:#ECEBE7; --ink-2:#A7A9B0; --ink-3:#6E7178;
    --line:#2C2F35; --line-2:#3A3D44;
    --done:#3FBE76; --done-soft:#17301F; --warn:#E0975A; --err:#E0645A;
    --accent:#ECEBE7; --accent-ink:#131417;
    --lower:#6C97E8; --upper:#3ABECB; --cardio:#F0983F; --core:#A07EE0; --aerobic:#E27B95;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.5; font-variant-numeric:tabular-nums}
  .wrap{max-width:580px; margin:0 auto; padding:20px 16px 44px}

  /* Setup */
  .setup-card{max-width:460px; margin:8vh auto 0; padding:26px 22px; background:var(--surface);
    border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow)}
  .setup-card h1{font-size:22px; margin:0 0 8px}
  .setup-card p{font-size:14px; color:var(--ink-2); margin:0 0 16px}
  .setup-card .hint{font-size:12.5px; color:var(--ink-3); margin-top:14px}
  .setup-card input{width:100%; padding:13px 14px; border:1.5px solid var(--line-2); border-radius:12px;
    background:var(--bg); color:var(--ink); font-family:inherit; font-size:15px; margin-bottom:12px}
  .setup-card input:focus{outline:none; border-color:var(--accent)}
  .setup-card button{width:100%; border:none; border-radius:12px; padding:14px; cursor:pointer;
    font-size:15px; font-weight:800; font-family:inherit; background:var(--accent); color:var(--accent-ink)}

  header{display:flex; align-items:flex-end; gap:8px; margin-bottom:6px}
  .date-block{flex:1}
  .date-block .kicker{font-size:12px; letter-spacing:.04em; color:var(--ink-3); margin-bottom:2px}
  .date-block .date{font-size:29px; font-weight:800; letter-spacing:-.01em; line-height:1.05}
  .icon-btn{background:none; border:1px solid var(--line-2); color:var(--ink-2);
    width:34px; height:34px; border-radius:10px; cursor:pointer; font-size:15px;
    display:grid; place-items:center; flex-shrink:0}
  .icon-btn:hover{background:var(--surface-2)}
  .sync{font-size:12px; color:var(--ink-3); margin:0 0 16px; height:16px}
  .sync.busy{color:var(--ink-2)} .sync.ok{color:var(--done)} .sync.warn{color:var(--warn)} .sync.err{color:var(--err)}

  .settings{display:none; gap:8px; flex-wrap:wrap; margin:0 0 18px}
  .settings.open{display:flex}
  .settings button{border:1px solid var(--line-2); background:var(--surface); color:var(--ink);
    font-family:inherit; font-size:13px; font-weight:600; padding:8px 12px; border-radius:10px; cursor:pointer}
  .settings button:hover{background:var(--surface-2)}

  /* 月曆 */
  .calcard{background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:14px 14px 16px; box-shadow:var(--shadow); margin-bottom:12px}
  .cal-head{display:flex; align-items:center; gap:8px; margin-bottom:12px}
  .cal-nav{width:30px; height:30px; border-radius:8px; border:1px solid var(--line-2); background:var(--surface);
    color:var(--ink-2); font-size:17px; cursor:pointer; display:grid; place-items:center; flex-shrink:0}
  .cal-nav:hover{background:var(--surface-2)}
  .cal-title{font-size:15px; font-weight:800; min-width:92px; text-align:center}
  .cal-count{margin-left:auto; font-size:13px; font-weight:800; color:var(--done);
    background:var(--done-soft); padding:6px 12px; border-radius:99px}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
  .cal-dow{text-align:center; font-size:11px; color:var(--ink-3); font-weight:600; padding-bottom:2px}
  .cal-cell{aspect-ratio:1/1; display:grid; place-items:center; font-size:13px; color:var(--ink-2); border-radius:9px}
  .cal-cell.blank{visibility:hidden}
  .cal-cell.done{background:var(--done-soft); color:var(--done); font-weight:800}
  .cal-cell.today{outline:2px solid var(--accent); outline-offset:-2px; color:var(--ink); font-weight:800}
  .cal-cell.today.done{outline-color:var(--done)}
  .monthsum{font-size:12.5px; color:var(--ink-2); text-align:center; margin:0 0 22px}
  .monthsum b{color:var(--ink); font-weight:700}

  .todaybar{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin:0 0 12px}
  .todaybar .big{font-size:16px; font-weight:800}
  .todaybar .mini{font-size:13px; color:var(--ink-2)}

  /* 登錄日期 */
  .logdate-row{display:flex; align-items:center; gap:8px; margin:0 0 20px; flex-wrap:wrap}
  .ld-label{font-size:13px; font-weight:700; color:var(--ink-2)}
  .logdate-row.backfill .ld-label{color:var(--warn)}
  #log-date{padding:8px 10px; border:1.5px solid var(--line-2); border-radius:10px; background:var(--surface);
    color:var(--ink); font-family:inherit; font-size:14px; font-weight:600}
  .logdate-row.backfill #log-date{border-color:var(--warn)}
  #log-date:focus{outline:none; border-color:var(--accent)}
  .ld-today{border:1px solid var(--line-2); background:var(--surface); color:var(--ink-2); font-family:inherit;
    font-size:12.5px; font-weight:700; padding:8px 12px; border-radius:10px; cursor:pointer}
  .ld-today:hover{background:var(--surface-2)}

  .cat{margin-bottom:20px}
  .cat-head{display:flex; align-items:center; gap:8px; margin:0 0 11px}
  .cat-dot{width:11px; height:11px; border-radius:4px; background:var(--c); flex-shrink:0}
  .cat-label{font-size:16px; font-weight:800}
  .cat-count{font-size:13px; color:var(--ink-2); font-weight:600}
  .chipwrap{display:flex; flex-wrap:wrap; gap:8px}
  .chip{position:relative; border:1.5px solid var(--line-2); background:var(--surface); border-radius:12px;
    padding:10px 14px; font-size:14.5px; font-weight:600; color:var(--ink);
    cursor:pointer; transition:transform .07s, background .12s, border-color .12s, color .12s;
    user-select:none; line-height:1.2}
  .chip:active{transform:scale(.95)}
  .chip.on{background:var(--c); border-color:var(--c); color:#fff}
  .chip[data-move].on::before{content:"✓ "; font-weight:800}
  .chip.add{border-style:dashed; color:var(--ink-2); font-weight:700; font-family:inherit}
  .chip.add:hover{color:var(--ink); border-color:var(--ink-3)}
  .chip.custom{padding-right:30px}
  .chip-del{position:absolute; top:50%; right:7px; transform:translateY(-50%);
    width:19px; height:19px; border-radius:50%; display:grid; place-items:center;
    font-size:14px; line-height:1; cursor:pointer; background:var(--surface-2); color:var(--ink-3)}
  .chip.custom.on .chip-del{background:rgba(255,255,255,.28); color:#fff}
  .chip-del:hover{background:var(--ink-3); color:var(--surface)}
  .add-box{display:inline-flex; align-items:center; gap:6px}
  .add-input{padding:10px 12px; border:1.5px solid var(--c); border-radius:12px;
    background:var(--surface); color:var(--ink); font-family:inherit; font-size:14.5px; font-weight:600; width:118px}
  .add-input:focus{outline:none}
  .add-ok{border:none; background:var(--c); color:#fff; border-radius:11px; padding:10px 13px;
    font-weight:800; cursor:pointer; font-family:inherit; font-size:14px}
  .add-cancel{border:none; background:none; color:var(--ink-3); font-family:inherit; font-size:13px; cursor:pointer; padding:6px}

  .detail{margin-top:10px; padding:13px 14px; border:1.5px solid var(--c); border-radius:13px;
    background:color-mix(in srgb, var(--c) 7%, transparent)}
  .detail-name{font-size:14.5px; font-weight:800; margin-bottom:9px; color:var(--c)}
  .seg{display:inline-flex; border:1.5px solid var(--line-2); border-radius:10px; overflow:hidden; margin-bottom:11px}
  .seg button{border:none; background:var(--surface); color:var(--ink-2); font-family:inherit;
    font-size:13.5px; font-weight:700; padding:8px 18px; cursor:pointer}
  .seg button + button{border-left:1.5px solid var(--line-2)}
  .seg button.on{background:var(--c); color:#fff}
  .fields{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
  .field{display:inline-flex; align-items:center; gap:6px; font-size:13.5px; color:var(--ink-2); font-weight:600}
  .field input{width:66px; padding:9px 8px; border:1.5px solid var(--line-2); border-radius:10px;
    background:var(--surface); color:var(--ink); font-family:inherit; font-size:15px; font-weight:700;
    text-align:center; -moz-appearance:textfield}
  .field input::-webkit-outer-spin-button,.field input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
  .field input:focus{outline:none; border-color:var(--c)}

  .actions{position:sticky; bottom:0; padding:14px 0 4px;
    background:linear-gradient(to top, var(--bg) 72%, transparent); margin-top:6px}
  .record{width:100%; border:none; border-radius:14px; padding:16px; cursor:pointer;
    font-size:16px; font-weight:800; font-family:inherit; background:var(--accent); color:var(--accent-ink)}
  .record:active{transform:scale(.985)}
  .record:disabled{opacity:.4; cursor:not-allowed}
  .clear-link{display:block; width:100%; text-align:center; margin-top:8px; background:none; border:none;
    color:var(--ink-3); font-size:13px; font-family:inherit; cursor:pointer; padding:4px}
  .clear-link:hover{color:var(--ink-2); text-decoration:underline}

  .recent{margin-top:30px}
  .sec-title{font-size:15px; font-weight:700; margin:0 0 12px}
  .log{list-style:none; margin:0; padding:0}
  .log li{display:flex; align-items:flex-start; gap:12px; padding:13px 4px; border-bottom:1px solid var(--line)}
  .log .ldate{font-size:14px; font-weight:700; width:74px; flex-shrink:0; padding-top:1px}
  .log .litems{flex:1; font-size:13.5px; color:var(--ink-2); line-height:1.55}
  .log .ldel{background:none; border:none; color:var(--ink-3); cursor:pointer; font-size:18px;
    width:30px; height:30px; border-radius:8px; flex-shrink:0}
  .log .ldel:hover{background:var(--surface-2); color:var(--ink)}
  .empty{color:var(--ink-3); font-size:14px; padding:14px 4px}

  .toast{position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom,0px));
    transform:translateX(-50%) translateY(16px); opacity:0; pointer-events:none;
    background:var(--ink); color:var(--bg); padding:12px 20px; border-radius:12px;
    font-size:14px; font-weight:700; box-shadow:0 8px 30px rgba(0,0,0,.25);
    transition:opacity .2s, transform .2s; z-index:50; max-width:90vw; text-align:center}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- 首次設定 -->
<div id="setup" style="display:none">
  <div class="wrap">
    <div class="setup-card">
      <h1>連接雲端</h1>
      <p>貼上你的 Cloudflare Worker 網址，之後訓練紀錄就會存到雲端、跨裝置同步。只需要設定一次。</p>
      <input id="setup-url" placeholder="https://xxxx.workers.dev" autocomplete="off">
      <button id="setup-save">連接</button>
      <p class="hint">還沒有網址嗎？先照對話裡的步驟建立 Cloudflare Worker，拿到網址再回來貼上。</p>
    </div>
  </div>
</div>

<!-- 主畫面 -->
<div id="app" style="display:none">
  <div class="wrap">
    <header>
      <div class="date-block">
        <div class="kicker">肌力循環訓練</div>
        <div class="date" id="today-date">—</div>
      </div>
      <button class="icon-btn" id="gear-btn" aria-label="設定">⚙</button>
      <button class="icon-btn" id="theme-toggle" aria-label="切換深淺色">◐</button>
    </header>
    <p class="sync" id="sync"></p>

    <div class="settings" id="settings">
      <button id="export-btn">匯出 CSV</button>
      <button id="reset-btn">重設雲端網址</button>
    </div>

    <div class="calcard">
      <div class="cal-head">
        <button class="cal-nav" id="cal-prev" aria-label="上個月">‹</button>
        <div class="cal-title" id="cal-title">—</div>
        <button class="cal-nav" id="cal-next" aria-label="下個月">›</button>
        <div class="cal-count" id="cal-count">運動 0 天</div>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>
    <p class="monthsum" id="monthsum"></p>

    <div class="todaybar">
      <span class="big" id="today-total">尚未勾選</span>
      <span class="mini" id="today-mini"></span>
    </div>

    <div class="logdate-row" id="logdate-row">
      <span class="ld-label" id="ld-label">訓練日期</span>
      <input type="date" id="log-date">
      <button class="ld-today" id="ld-today">今天</button>
    </div>

    <div id="cats"></div>

    <div class="recent">
      <h2 class="sec-title">最近紀錄</h2>
      <ul class="log" id="log"></ul>
    </div>
  </div>

  <div class="actions">
    <div class="wrap" style="padding-top:0;padding-bottom:0">
      <button class="record" id="record-btn" disabled>記錄訓練</button>
      <button class="clear-link" id="clear-btn">清除勾選</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* ---------- 動作清單 ---------- */
const CATS=[
  {key:"lower",  label:"下肢", cvar:"var(--lower)", moves:["深蹲","分腿蹲","弓箭步","壺鈴擺盪","藥球","側蹲","螃蟹走"]},
  {key:"upper",  label:"上肢", cvar:"var(--upper)", moves:["背拉","肩推","肩推+火箭","引體向上","伏地挺身","平板划船+硬舉"]},
  {key:"cardio", label:"心肺", cvar:"var(--cardio)", moves:["登山者","開合跳","波比跳","藥球弓步抬腿+轉體"]},
  {key:"core",   label:"核心", cvar:"var(--core)", moves:["仰臥抬腿","死蟲","棒式","無"]},
  {key:"aerobic",label:"有氧", cvar:"var(--aerobic)", moves:["划船","滑雪","跑步機爬坡","橢圓機","飛輪"]},
];
const CAT_BY_KEY={}; CATS.forEach(c=>CAT_BY_KEY[c.key]=c);
const CAT_INDEX={}; CATS.forEach((c,i)=>CAT_INDEX[c.key]=i);
const DETAIL={"aerobic|划船":"distint","aerobic|滑雪":"distint","aerobic|跑步機爬坡":"duration","aerobic|橢圓機":"duration","aerobic|飛輪":"duration"};
const DOW=["日","一","二","三","四","五","六"];

/* ---------- 儲存/設定 ---------- */
const LS_API="ding-workout-api", K_DRAFT="ding-workout-v3-draft",
      K_THEME="ding-workout-v2-theme", K_MIRROR="ding-workout-v3-mirror";
const DEFAULT_API=""; /* 之後可把網址填在這，就不用每台裝置貼一次 */
let apiUrl=localStorage.getItem(LS_API)||DEFAULT_API;
function load(k,fb){try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch(e){return fb;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

/* ---------- 日期 ---------- */
function iso(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),da=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${da}`;}

/* ---------- 狀態 ---------- */
const now=new Date(), TODAY=iso(now);
const nowY=now.getFullYear(), nowM=now.getMonth();
let viewY=nowY, viewM=nowM;
let logDate=TODAY;
let sessions=[], custom={};
let draft=load(K_DRAFT,{date:TODAY,checks:{}});
if(draft.date!==TODAY){draft={date:TODAY,checks:{}};save(K_DRAFT,draft);}
let theme=load(K_THEME,null); if(theme)document.documentElement.setAttribute("data-theme",theme);
let addingCat=null;

const $=(id)=>document.getElementById(id);
const keyOf=(cat,name)=>cat+"|"+name;
const movesOf=(cat)=>CAT_BY_KEY[cat].moves.concat(custom[cat]||[]);

/* ---------- 雲端 ---------- */
function saveMirror(){save(K_MIRROR,{sessions,custom});}
function loadMirror(){const m=load(K_MIRROR,null); if(m){sessions=m.sessions||[]; custom=m.custom||{};}}
async function apiGet(){const r=await fetch(apiUrl); if(!r.ok)throw new Error(r.status); return r.json();}
async function apiPost(b){const r=await fetch(apiUrl,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}); if(!r.ok)throw new Error(r.status); return r.json();}
function setSync(t,cls){const e=$("sync"); if(e){e.textContent=t; e.className="sync "+(cls||"");}}

async function refresh(){
  if(!apiUrl)return;
  setSync("雲端同步中…","busy");
  try{
    const doc=await apiGet();
    sessions=doc.sessions||[]; custom=doc.custom||{};
    saveMirror(); renderAll(); setSync("已同步","ok");
  }catch(e){ setSync("離線・顯示上次同步的資料","warn"); }
}
async function pushCustom(){
  saveMirror();
  try{ await apiPost({op:"setCustom",custom}); setSync("已同步","ok"); }
  catch(e){ setSync("自訂動作未同步（離線）","warn"); }
}

/* ---------- 明細名稱：沒填完 → 一般勾選 ---------- */
function labelFromVal(move,v){
  if(v&&typeof v==="object"){
    if(v.mode==="interval") return (v.work&&v.rest&&v.sets)?`${move}（間歇 ${v.work}-${v.rest}秒 ×${v.sets}組）`:move;
    if(v.mode==="duration") return v.minutes?`${move}（${v.minutes}分鐘）`:move;
    return v.distance?`${move}（${v.distance}公尺）`:move;
  }
  return move;
}

/* ---------- 渲染 ---------- */
function renderAll(){renderHeader();renderMonth();renderCats();renderLog();renderLogDate();}

function renderHeader(){
  $("today-date").textContent=`${now.getMonth()+1} 月 ${now.getDate()} 日 ・ 週${DOW[now.getDay()]}`;
}

function renderMonth(){
  $("cal-title").textContent=`${viewY} 年 ${viewM+1} 月`;
  const first=new Date(viewY,viewM,1), startDow=first.getDay();
  const daysIn=new Date(viewY,viewM+1,0).getDate();
  const doneDays=new Set();
  sessions.forEach(s=>{const d=new Date(s.date+"T00:00:00"); if(d.getFullYear()===viewY&&d.getMonth()===viewM)doneDays.add(d.getDate());});
  $("cal-count").textContent=`運動 ${doneDays.size} 天`;
  const grid=$("cal-grid"); grid.innerHTML="";
  DOW.forEach(w=>{const h=document.createElement("div"); h.className="cal-dow"; h.textContent=w; grid.appendChild(h);});
  for(let i=0;i<startDow;i++){const b=document.createElement("div"); b.className="cal-cell blank"; grid.appendChild(b);}
  for(let day=1;day<=daysIn;day++){
    const c=document.createElement("div"); c.className="cal-cell"; c.textContent=day;
    if(doneDays.has(day))c.classList.add("done");
    if(viewY===nowY&&viewM===nowM&&day===now.getDate())c.classList.add("today");
    grid.appendChild(c);
  }
  const tally={}; CATS.forEach(cc=>tally[cc.key]=0);
  sessions.forEach(s=>{const d=new Date(s.date+"T00:00:00"); if(d.getFullYear()===viewY&&d.getMonth()===viewM)s.items.forEach(it=>{if(tally[it.cat]!=null)tally[it.cat]++;});});
  $("monthsum").innerHTML= doneDays.size ? "本月動作"+CATS.map(cc=>`　${cc.label} <b>${tally[cc.key]}</b>`).join("") : "這個月還沒有訓練紀錄";
}

function renderLogDate(){
  const inp=$("log-date"); if(inp&&inp.value!==logDate)inp.value=logDate;
  const row=$("logdate-row");
  if(logDate!==TODAY){row.classList.add("backfill"); $("ld-label").textContent="補登日期";}
  else{row.classList.remove("backfill"); $("ld-label").textContent="訓練日期";}
}

function renderCats(){
  const wrap=$("cats"); wrap.innerHTML="";
  CATS.forEach(cat=>{
    const all=movesOf(cat.key), cust=custom[cat.key]||[];
    const sec=document.createElement("section");
    sec.className="cat"; sec.style.setProperty("--c",cat.cvar);
    const n=all.filter(m=>draft.checks[keyOf(cat.key,m)]).length;
    const chips=all.map(m=>{
      const on=!!draft.checks[keyOf(cat.key,m)], isC=cust.includes(m);
      return `<div class="chip${on?' on':''}${isC?' custom':''}" data-cat="${cat.key}" data-move="${m}">${m}${isC?'<span class="chip-del" data-del="1">×</span>':''}</div>`;
    }).join("");
    const addCtl = addingCat===cat.key
      ? `<span class="add-box"><input class="add-input" data-cat="${cat.key}" placeholder="動作名稱" autocomplete="off"><button class="add-ok" data-cat="${cat.key}">加入</button><button class="add-cancel">取消</button></span>`
      : `<button class="chip add" data-add="${cat.key}">＋ 新增</button>`;
    let panels="";
    all.forEach(m=>{
      const k=keyOf(cat.key,m), v=draft.checks[k], type=DETAIL[k];
      if(!type||!v||typeof v!=="object")return;
      if(type==="distint"){
        const dist=v.mode!=="interval";
        const fields = dist
          ? `<span class="field"><input type="number" inputmode="numeric" data-f="distance" value="${v.distance||''}" placeholder="0"> 公尺</span>`
          : `<span class="field">運動 <input type="number" inputmode="numeric" data-f="work" value="${v.work||''}" placeholder="0"> 秒</span>
             <span class="field">休息 <input type="number" inputmode="numeric" data-f="rest" value="${v.rest||''}" placeholder="0"> 秒</span>
             <span class="field">組數 <input type="number" inputmode="numeric" data-f="sets" value="${v.sets||''}" placeholder="0"></span>`;
        panels+=`<div class="detail" data-key="${k}"><div class="detail-name">${m}</div>
          <div class="seg"><button data-mode="distance" class="${dist?'on':''}">距離</button><button data-mode="interval" class="${dist?'':'on'}">間歇</button></div>
          <div class="fields">${fields}</div></div>`;
      }else if(type==="duration"){
        panels+=`<div class="detail" data-key="${k}"><div class="detail-name">${m}</div>
          <div class="fields"><span class="field">運動時間 <input type="number" inputmode="numeric" data-f="minutes" value="${v.minutes||''}" placeholder="0"> 分鐘</span></div></div>`;
      }
    });
    sec.innerHTML=`<div class="cat-head"><span class="cat-dot"></span><span class="cat-label">${cat.label}</span><span class="cat-count">${n>0?"已選 "+n:""}</span></div>
      <div class="chipwrap">${chips}${addCtl}</div>${panels}`;
    wrap.appendChild(sec);
  });
  wrap.querySelectorAll(".chip[data-move]").forEach(ch=>ch.onclick=(e)=>{ if(e.target.dataset.del){delCustom(ch.dataset.cat,ch.dataset.move);return;} toggle(ch.dataset.cat,ch.dataset.move); });
  wrap.querySelectorAll(".chip.add").forEach(b=>b.onclick=()=>{addingCat=b.dataset.add; renderCats();});
  wrap.querySelectorAll(".add-ok").forEach(b=>b.onclick=()=>doAdd(b.dataset.cat));
  wrap.querySelectorAll(".add-cancel").forEach(b=>b.onclick=()=>{addingCat=null; renderCats();});
  wrap.querySelectorAll(".add-input").forEach(inp=>inp.onkeydown=(e)=>{ if(e.key==="Enter")doAdd(inp.dataset.cat); else if(e.key==="Escape"){addingCat=null;renderCats();} });
  wrap.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{ const key=b.closest(".detail").dataset.key; if(draft.checks[key]&&typeof draft.checks[key]==="object"){draft.checks[key].mode=b.dataset.mode; save(K_DRAFT,draft); renderCats();} });
  wrap.querySelectorAll(".detail input").forEach(inp=>inp.oninput=()=>{ const key=inp.closest(".detail").dataset.key, obj=draft.checks[key]; if(obj&&typeof obj==="object"){obj[inp.dataset.f]=inp.value; save(K_DRAFT,draft);} });
  if(addingCat){const i=wrap.querySelector(".add-input"); if(i)i.focus();}
  renderSummary();
}
function renderSummary(){
  const counts={}; CATS.forEach(c=>counts[c.key]=0); let total=0;
  Object.keys(draft.checks).forEach(k=>{const cat=k.split("|")[0]; if(counts[cat]!=null){counts[cat]++;total++;}});
  $("today-total").textContent=total?`已選 ${total} 個動作`:"尚未勾選";
  const parts=[]; CATS.forEach(c=>{if(counts[c.key])parts.push(c.label+" "+counts[c.key]);});
  $("today-mini").textContent=parts.length?"・ "+parts.join("　"):"";
  $("record-btn").disabled=total===0;
}
function renderLog(){
  const ul=$("log"); ul.innerHTML="";
  const sorted=[...sessions].sort((a,b)=>{ if(a.date!==b.date)return a.date<b.date?1:-1; return b.ts-a.ts; }).slice(0,15);
  if(!sorted.length){ul.innerHTML=`<li class="empty">還沒有紀錄，完成第一次訓練後會出現在這裡</li>`;return;}
  sorted.forEach(s=>{
    const d=new Date(s.date+"T00:00:00");
    const li=document.createElement("li");
    li.innerHTML=`<span class="ldate">${d.getMonth()+1}/${d.getDate()} 週${DOW[d.getDay()]}</span><span class="litems">${s.items.map(it=>it.name).join("、")}</span><button class="ldel" aria-label="刪除">×</button>`;
    li.querySelector(".ldel").onclick=()=>delSession(s.id);
    ul.appendChild(li);
  });
}

/* ---------- 動作 ---------- */
function toggle(cat,move){
  const k=keyOf(cat,move);
  if(draft.checks[k]){delete draft.checks[k];}
  else{const t=DETAIL[k]; draft.checks[k]= t==="distint"?{mode:"distance",distance:"",work:"",rest:"",sets:""} : t==="duration"?{mode:"duration",minutes:""} : 1;}
  save(K_DRAFT,draft); renderCats();
}
function doAdd(cat){
  const inp=$("cats").querySelector('.add-input[data-cat="'+cat+'"]'); if(!inp)return;
  const name=inp.value.trim();
  if(!name){addingCat=null; renderCats(); return;}
  if(CAT_BY_KEY[cat].moves.includes(name)||(custom[cat]||[]).includes(name)){toast("已經有這個動作了"); return;}
  custom[cat]=(custom[cat]||[]).concat([name]);
  addingCat=null; renderCats(); pushCustom(); toast(`已新增「${name}」`);
}
function delCustom(cat,move){
  custom[cat]=(custom[cat]||[]).filter(x=>x!==move);
  delete draft.checks[keyOf(cat,move)]; save(K_DRAFT,draft);
  renderCats(); pushCustom(); toast(`已移除「${move}」`);
}
async function record(){
  const items=Object.keys(draft.checks).map(k=>{const idx=k.indexOf("|"),cat=k.slice(0,idx),name=k.slice(idx+1); return {cat,name:labelFromVal(name,draft.checks[k])};});
  if(!items.length)return;
  items.sort((a,b)=>CAT_INDEX[a.cat]-CAT_INDEX[b.cat]);
  const theDate=logDate;
  const session={id:"s"+Date.now(),date:theDate,ts:Date.now(),items};
  const btn=$("record-btn"); btn.disabled=true; setSync("儲存中…","busy");
  try{
    const res=await apiPost({op:"add",session});
    sessions.push(res.session||session); saveMirror();
    draft={date:TODAY,checks:{}}; save(K_DRAFT,draft);
    logDate=TODAY;
    renderAll(); setSync("已同步","ok");
    toast(`已記錄 ${theDate===TODAY?"今日":theDate} 訓練 ・ ${items.length} 個動作`);
    window.scrollTo({top:0,behavior:"smooth"});
  }catch(e){
    btn.disabled=false; setSync("儲存失敗","err");
    toast("沒存到雲端，請確認網路後再按一次");
  }
}
async function delSession(id){
  setSync("刪除中…","busy");
  try{ await apiPost({op:"delete",id}); sessions=sessions.filter(s=>s.id!==id); saveMirror(); renderAll(); setSync("已同步","ok"); toast("已刪除該筆紀錄"); }
  catch(e){ setSync("刪除失敗","err"); toast("刪除沒同步到雲端，請稍後再試"); }
}
function clearDraft(){draft={date:TODAY,checks:{}};save(K_DRAFT,draft);renderCats();}

function exportCSV(){
  const rows=[["日期","星期","動作"]];
  [...sessions].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0).forEach(s=>{const d=new Date(s.date+"T00:00:00"); rows.push([s.date,"週"+DOW[d.getDay()],s.items.map(i=>i.name).join(" / ")]);});
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="workout-"+TODAY+".csv"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

let tt=null;
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2400);}

/* ---------- 首次設定 ---------- */
function showApp(){$("setup").style.display="none"; $("app").style.display="";}
function showSetup(){$("setup").style.display=""; $("app").style.display="none";}
$("setup-save").onclick=()=>{
  let u=$("setup-url").value.trim();
  if(!/^https?:\/\//.test(u)){alert("請貼上完整網址，開頭是 https://");return;}
  u=u.replace(/\/+$/,""); apiUrl=u; localStorage.setItem(LS_API,u);
  showApp(); renderAll(); refresh();
};

/* ---------- 綁定 ---------- */
$("record-btn").onclick=record;
$("clear-btn").onclick=clearDraft;
$("gear-btn").onclick=()=>$("settings").classList.toggle("open");
$("export-btn").onclick=exportCSV;
$("reset-btn").onclick=()=>{ localStorage.removeItem(LS_API); apiUrl=""; $("settings").classList.remove("open"); $("setup-url").value=""; showSetup(); };
$("cal-prev").onclick=()=>{ viewM--; if(viewM<0){viewM=11;viewY--;} renderMonth(); };
$("cal-next").onclick=()=>{ viewM++; if(viewM>11){viewM=0;viewY++;} renderMonth(); };
$("log-date").onchange=()=>{ logDate=$("log-date").value||TODAY; renderLogDate(); };
$("ld-today").onclick=()=>{ logDate=TODAY; renderLogDate(); };
$("theme-toggle").onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const isDark=cur?cur==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  const next=isDark?"light":"dark"; document.documentElement.setAttribute("data-theme",next); save(K_THEME,next);
};

/* ---------- 啟動 ---------- */
$("log-date").value=TODAY;
loadMirror();
if(apiUrl){ showApp(); renderAll(); refresh(); }
else { showSetup(); }
</script>
</body>
